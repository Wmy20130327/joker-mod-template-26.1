# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1
loader_version=0.19.5
# 注意：loom 必须用正式版本号。SNAPSHOT（如 1.18-SNAPSHOT）只存在于 Fabric 官方 maven，
# 且 Gradle Plugin Portal / 国内镜像上有陈旧的同名元数据，会导致插件解析失败。
loom_version=1.18.4

# Mod Properties
version=1.0.0-26.1
group=com.wmy.landmine

# Dependencies
# 26.1 系列对应的最新 Fabric API（见 https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/）
fabric_api_version=0.155.3+26.1.2